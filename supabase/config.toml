[project]
id = "stopincrust"

[api]
enabled = true
port = 54321

[db]
port = 54322

[auth]
enabled = true
site_url = "http://localhost:54321"

# LOCAL DEV ONLY: auto-confirm phone OTP so login works without real SMS.
# The twilio block below is a dummy provider — with autoconfirm = true no SMS is actually sent.
# Remove/replace this whole section with real Twilio credentials before production.
[auth.sms]
enable_signup = true
autoconfirm = true
template = "Your code is {{ .Code }}"

[auth.sms.twilio]
enabled = true
account_sid = "AC00000000000000000000000000000000"
auth_token = "dummy-local-dev-only"
message_service_sid = "MG00000000000000000000000000000000"

# Fixed OTP codes for local testing (no real SMS needed)
[auth.sms.test_otp]
"+33600000000" = "123456"
"+33600000002" = "123456"
"+33600000003" = "123456"
